services:
  traefik:
    image: traefik:v3.7
    container_name: traefik-prod
    restart: always
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Global redirect to HTTPS
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      # Let's Encrypt configuration
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
    networks:
      - portfolio-network

  db:
    image: postgres:15-alpine
    container_name: portfolio-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_db}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - portfolio-network

  backend:
    image: ghcr.io/${REPO}-backend:latest
    container_name: portfolio-backend-prod
    restart: always
    depends_on:
      - db
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=${POSTGRES_DB:-portfolio_db};Username=${POSTGRES_USER:-portfolio_user};Password=${POSTGRES_PASSWORD:-portfolio_secure_password}
      - ASPNETCORE_ENVIRONMENT=Production
      - DownloadPassword=${DOWNLOAD_PASSWORD:-securepassword}
    networks:
      - portfolio-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=myresolver"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"

  frontend:
    image: ghcr.io/${REPO}-frontend:latest
    container_name: portfolio-frontend-prod
    restart: always
    depends_on:
      - backend
    networks:
      - portfolio-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

volumes:
  pgdata_prod:

networks:
  portfolio-network:
    driver: bridge
