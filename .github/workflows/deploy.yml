name: Deploy to VPS

on:
  push:
    branches:
      - main
      - development

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ env.REPO }}-frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ env.REPO }}-backend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push-images

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy Compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: ${{ github.ref == 'refs/heads/main' && '/opt/portfolio-prod' || '/opt/portfolio-test' }}

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DOWNLOAD_PASSWORD: ${{ secrets.DOWNLOAD_PASSWORD }}
          DOMAIN: ${{ github.ref == 'refs/heads/main' && 'michaelportmann.ch' || 'test.michaelportmann.ch' }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          GITHUB_REF: ${{ github.ref }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_REPOSITORY_NAME,GHCR_USERNAME,GHCR_TOKEN,DB_PASSWORD,DOWNLOAD_PASSWORD,DOMAIN,ACME_EMAIL,GITHUB_REF
          script: |
            set -eu

            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              TARGET_DIR="/opt/portfolio-prod"
              export BACKEND_CONTAINER_NAME="portfolio-backend-prod"
              export FRONTEND_CONTAINER_NAME="portfolio-frontend-prod"
              export ROUTER_PREFIX="prod"
              COMPOSE_PROJECT="portfolio"
              SERVICES_TO_START="traefik backend frontend"
              # Ensure the network exists before traefik is started, so test deployment doesn't fail
              docker network create portfolio-network || true
            else
              TARGET_DIR="/opt/portfolio-test"
              export BACKEND_CONTAINER_NAME="portfolio-backend-test"
              export FRONTEND_CONTAINER_NAME="portfolio-frontend-test"
              export ROUTER_PREFIX="test"
              COMPOSE_PROJECT="portfolio-test"
              SERVICES_TO_START="backend frontend"
            fi

            cd $TARGET_DIR

            export REPO="$(printf '%s' "$GITHUB_REPOSITORY_NAME" | tr '[:upper:]' '[:lower:]')"
            export POSTGRES_USER="portfolio_user"
            export POSTGRES_DB="portfolio_db"
            export POSTGRES_PASSWORD="$DB_PASSWORD"

            # Check that the shared network and database exist
            docker network inspect shared-database >/dev/null
            docker inspect postgres-shared >/dev/null

            # Verify the PostgreSQL server is ready
            docker exec postgres-shared pg_isready -U postgres_admin -d postgres

            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              # Prepare Let's Encrypt storage
              mkdir -p letsencrypt
              touch letsencrypt/acme.json
              chmod 600 letsencrypt/acme.json
            fi

            # Authenticate to GitHub Container Registry
            printf '%s' "$GHCR_TOKEN" |
              docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            # Validate the Compose configuration before deployment
            docker compose -f docker-compose.prod.yml config -q

            # Pull updated images
            docker compose -f docker-compose.prod.yml pull $SERVICES_TO_START

            # To avoid "container name is already in use" errors during migration,
            # we forcibly stop and remove old containers before bringing up new ones.
            docker rm -f $BACKEND_CONTAINER_NAME $FRONTEND_CONTAINER_NAME 2>/dev/null || true
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              docker rm -f traefik-prod 2>/dev/null || true
            fi

            # Recreate application containers and remove obsolete services
            docker compose -p "$COMPOSE_PROJECT" -f docker-compose.prod.yml up -d --remove-orphans $SERVICES_TO_START

            # Show resulting status
            docker compose -p "$COMPOSE_PROJECT" -f docker-compose.prod.yml ps

            # Log out and clean up unused images
            docker logout ghcr.io
            docker image prune -f